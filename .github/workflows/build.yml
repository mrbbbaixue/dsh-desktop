name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & test
        run: dotnet test -c Release

      - name: Publish single-file
        run: dotnet publish src/DshDesktop -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DshDesktop-win-x64
          path: dist/DshDesktop.exe
