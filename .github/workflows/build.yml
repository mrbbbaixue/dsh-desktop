name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# 用 .NET SDK 10 编译;应用目标是 net48(Windows 11 自带)。产物在 build/。
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build & test
        run: dotnet test -c Release

  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $env:GITHUB_REF_NAME } else { '' }
          if ($tag) { ./Scripts/build.ps1 -Tag $tag } else { ./Scripts/build.ps1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dsh-desktop-win-x64
          path: |
            build/*.zip
            build/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem build -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -eq 'SHA256SUMS.txt' } |
            ForEach-Object FullName)
          gh release create "${{ github.ref_name }}" @assets --generate-notes --title "${{ github.ref_name }}"
